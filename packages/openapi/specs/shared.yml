servers:
  - url: "{scheme}://{host}{basePath}"
    variables:
      scheme:
        default: https
      host:
        default: api.browserstack.com
      basePath:
        default: "/5"
  - url: "{scheme}://{host}"
    variables:
      scheme:
        default: https
      host:
        default: api-cloud.browserstack.com

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

  schemas:
    400.BadRequest:
      description: Bad request.
    401.Unauthorized:
      description: Your BrowserStack access credentials are invalid.
    403.Forbidden:
      description: Authorized user is not the owner of the resource.
    404.NotFound:
      description: The requested resource could not be found.
    422.UnprocessableEntity:
      description: Request is well-formed but has semantic errors. The response will provide
        more details about error.
    5xx.InternalServerError:
      description: Indicates an error with BrowserStack servers.
    Browser:
      title: Browser
      type: object
      required:
      - browser
      - browser_version
      properties:
        browser:
          type: string
          nullable: true
          description: Null for App Automate sessions, which have no browser.
          example: Chrome
        browser_version:
          type: string
          example: '80.0'
    BrowserDevice:
      title: BrowserDevice
      allOf:
      - $ref: '#/components/schemas/Browser'
      - type: object
        required:
        - devices
        - real_devices
        properties:
          browser:
            type: string
            example: Android Browser
          devices:
            type: array
            items:
              type: string
              example: Google Nexus
          real_devices:
            type: array
            items:
              type: string
            maxItems: 0
    BrowserList:
      title: BrowserList
      type: array
      items:
        $ref: '#/components/schemas/BrowserPlatform'
    BrowserMapWindows:
      title: BrowserMapWindows
      type: object
      additionalProperties:
        type: array
        items:
          $ref: '#/components/schemas/BrowserPlatform'
    BrowserMapOSX:
      title: BrowserMapOSX
      type: object
      additionalProperties:
        type: array
        items:
          $ref: '#/components/schemas/BrowserPlatform'
    BrowserMapWinPhone:
      title: BrowserMapWinPhone
      type: object
      additionalProperties:
        type: array
        items:
          $ref: '#/components/schemas/BrowserDevice'
    BrowserMapAndroid:
      title: BrowserMapAndroid
      type: object
      additionalProperties:
        type: array
        items:
          $ref: '#/components/schemas/BrowserRealDevice'
    BrowserMap:
      title: BrowserMap
      type: object
      properties:
        Windows:
          $ref: '#/components/schemas/BrowserMapWindows'
        OS X:
          $ref: '#/components/schemas/BrowserMapOSX'
        winphone:
          $ref: '#/components/schemas/BrowserMapWinPhone'
        android:
          $ref: '#/components/schemas/BrowserMapAndroid'
    BrowserPlatform:
      title: BrowserPlatform
      allOf:
      - $ref: '#/components/schemas/Browser'
      - type: object
        required:
        - os
        - os_version
        properties:
          os:
            type: string
            example: Windows
          os_version:
            type: string
            example: '10'
          device:
            type: string
            nullable: true
            example:
          real_mobile:
            type: boolean
            example:
    BrowserRealDevice:
      title: BrowserRealDevice
      allOf:
      - $ref: '#/components/schemas/Browser'
      - type: object
        required:
        - devices
        - real_devices
        properties:
          browser:
            type: string
            example: Android Browser
          devices:
            type: array
            items:
              type: string
            maxItems: 0
          real_devices:
            type: array
            items:
              type: string
              example: Google Pixel 6 Pro
    NewWorker:
      title: NewWorker
      allOf:
      - type: object
        required:
        - url
        - os
        - os_version
        properties:
          url:
            type: string
            description: URL to be opened in the browser
            example: https://www.google.com/ncr
          timeout:
            type: number
            description: 'Time in seconds before the worker is terminated. The default
              value is 300 seconds and the minimum value is 60 seconds. IMPORTANT: Irrespective
              of the timeout parameter, a browser worker is alive for a maximum time of
              1800 seconds.'
            example: 300
          os:
            type: string
            description: Operating system name.
            example: Windows
          os_version:
            type: string
            description: Operating system version.
            example: '10'
          name:
            type: string
            description: Name of the worker.
            example: qunit-test-pricing
          build:
            type: string
            description: Name of the build the session is running under.
            example: staging-build
          project:
            type: string
            description: Name of the project the build is organized under.
            example: pricing-project
          browserstack.video:
            type: boolean
            description: Enable video recording for the session. The default value is
              false.
            example: true
          resolution:
            type: string
            description: Set the resolution of VM before the beginning of your test. Available
              for Desktop only. The default value is 1024x768.
            example: 1024x768
      - oneOf:
        - type: object
          required:
          - browser
          - browser_version
          properties:
            browser:
              type: string
              description: Browser name.
              example: Chrome
            browser_version:
              type: string
              description: Browser version.
              example: '80.0'
        - type: object
          properties:
            device:
              type: string
              description: Device name. If a device is not provided it defaults to the
                first device available for that os version.
              example: iPhone 11 Pro
            browser:
              type: string
              description: Browser name.
              example: Chrome
            browser_version:
              type: string
              description: Browser version.
              example: '80.0'
    AutomatePlan:
      title: AutomatePlan
      type: object
      required:
      - automate_plan
      - parallel_sessions_running
      - parallel_sessions_max_allowed
      - team_parallel_sessions_max_allowed
      - queued_sessions
      - queued_sessions_max_allowed
      properties:
        automate_plan:
          type: string
          description: Specifies your Automate plan name
          example: Automate Mobile
        terminal_access:
          type: string
          description: Terminal access level
          example: Public
        parallel_sessions_running:
          type: number
          description: Number of parallel sessions currently running
          example: 0
        parallel_sessions_max_allowed:
          type: number
          description: Maximum number of parallel sessions you can run
          example: 0
        team_parallel_sessions_max_allowed:
          type: number
          description: Maximum number of parallel sessions allowed in a team
          example: 250
        queued_sessions:
          type: number
          description: Number of sessions currently queued
          example: 10
        queued_sessions_max_allowed:
          type: number
          description: Maximum number of sessions that can be queued
          example: 240
    AutomateBuildSessionContainer:
      title: AutomateBuildSessionContainer
      type: object
      required:
      - automation_session
      properties:
        automation_session:
          $ref: '#/components/schemas/AutomateBuildSession'
    AutomateBuildSession:
      title: AutomateBuildSession
      type: object
      description: The lighter session summary embedded in a build's detail response. It has no log or video URLs;
        fetch the full session with getAutomateSession.
      properties:
        hashed_id: { type: string }
        name: { type: string }
        status: { type: string }
        reason: { type: string }
        duration: { type: number }
        os: { type: string }
        os_version: { type: string }
        browser: { type: string }
        browser_version: { type: string }
        device: { type: string, nullable: true }
        build_name: { type: string }
        project_name: { type: string }
        build_hashed_id: { type: string }
        test_priority: { type: string, nullable: true }
    AutomateSessionBase:
      title: AutomateSessionBase
      description: Fields common to Automate and App Automate sessions. Each product extends it with its own (AutomateSession, AppAutomateSession).
      allOf:
      - $ref: '#/components/schemas/BrowserPlatform'
      - type: object
        required:
        - hashed_id
        - name
        - duration
        - status
        - browserstack_status
        - reason
        - build_name
        - project_name
        - logs
        - browser_url
        - public_url
        - video_url
        - created_at
        properties:
          hashed_id:
            type: string
            description: Hashed ID of the session
            example: 4207442b2b0567368956dba064c22a3235a76214
          name:
            type: string
            description: Name of your session
            example: pricing_project_build
          duration:
            type: number
            description: Duration of session execution
            example: 10
          status:
            type: string
            description: >-
              Outcome of the session. Observed live on Automate and App Automate: passed, failed. `running` and
              `timeout` are documented but not yet observed; `done` is a browserstack_status value, not a status.
            enum:
            - running
            - timeout
            - failed
            - done
            - passed
          browserstack_status:
            type: string
            description: >-
              Execution status of the session. Observed live: done, failed, passed.
          reason:
            type: string
            description: Reason for test status
            example: CLIENT_STOPPED_SESSION
          build_name:
            type: string
            description: Name of the build
            example: pricing_project_build
          project_name:
            type: string
            description: Name of the project
            example: pricing_project
          logs:
            type: string
            description: Link to the session logs
            example: https://automate.browserstack.com/builds/5343932818f9330c5d2b5c72aaf9dd8fde77b428/sessions/550709149fe79e949363b581e774d5ebffa1b8fe/logs
          browser_url:
            type: string
            description: URL to view the session on Automate dashboard
            example: https://automate.browserstack.com/builds/5343932818f9330c5d2b5c72aaf9dd8fde77b428/sessions/550709149fe79e949363b581e774d5ebffa1b8fe
          public_url:
            type: string
            description: URL to view the session publicly
            example: https://automate.browserstack.com/builds/5343932818f9330c5d2b5c72aaf9dd8fde77b428/sessions/550709149fe79e949363b581e774d5ebffa1b8fe?auth_token=01df4e51ba67eb743484a08b024a44601a2ae0399c5c011a68d9564147be1387
          appium_logs_url:
            type: string
            description: URL to view the Appium logs
            example: https://api.browserstack.com/automate/builds/5343932818f9330c5d2b5c72aaf9dd8fde77b428/sessions/550709149fe79e949363b581e774d5ebffa1b8fe/appiumlogs
          video_url:
            type: string
            description: URL to view session video
            example: https://automate.browserstack.com/sessions/550709149fe79e949363b581e774d5ebffa1b8fe/video
          browser_console_logs_url:
            type: string
            description: URL to view browser console logs
            example: https://automate.browserstack.com/s3-upload/bs-selenium-logs-aps/s3.ap-south-1/550709149fe79e949363b581e774d5ebffa1b8fe/550709149fe79e949363b581e774d5ebffa1b8fe-console-logs-v2.txt
          har_logs_url:
            type: string
            description: URL to view browser logs
            example: https://automate.browserstack.com/s3-upload/bs-selenium-logs-euw/s3.eu-west-1/550709149fe79e949363b581e774d5ebffa1b8fe/550709149fe79e949363b581e774d5ebffa1b8fe-har-logs.txt
          selenium_logs_url:
            type: string
            description: URL to view selenium logs
            example: https://automate.browserstack.com/s3-upload/bs-selenium-logs-euw/s3.eu-west-1/550709149fe79e949363b581e774d5ebffa1b8fe/550709149fe79e949363b581e774d5ebffa1b8fe-selenium-logs.txt
          selenium_telemetry_logs_url:
            type: string
            description: URL to view telemetry logs if it is enabled in your Selenium 4 session
            example: https://automate.browserstack.com/s3-upload/bs-selenium-logs-euw/s3.eu-west-1/550709149fe79e949363b581e774d5ebffa1b8fe/550709149fe79e949363b581e774d5ebffa1b8fe-selenium-logs.txt
          created_at:
            type: string
            description: Timestamp at which the session started executing
            example: '2020-03-11T10:14:36.000Z'
          build_hashed_id:
            type: string
            description: >-
              Hashed ID of the Automate build this session belongs to. This is the Automate build id, not the
              Test Reporting build id.
            example: 5a2325a471c829812cd32ed5e63fdc5f8d2c0250
          session_terminal_logs_url:
            type: string
            description: Presigned URL of the session's terminal logs.
          build_terminal_logs_url:
            type: string
            description: Presigned URL of the build's terminal logs.
          test_priority:
            type: string
            nullable: true
            description: Priority label set on the session, if any.
          insights:
            type: object
            additionalProperties: true
            description: Time breakdown for the session (totals, BrowserStack vs user time, and optimisation links).
    Status:
      title: Status
      type: object
      required:
      - used_time
      - running_sessions
      - session_limit
      - total_available_time
      properties:
        used_time:
          type: number
          example: 10
        running_sessions:
          type: number
          example: 0
        session_limit:
          type: number
          example: 0
        total_available_time:
          type: string
          example: Unlimited Testing Time
    Worker:
      title: Worker
      allOf:
      - $ref: '#/components/schemas/BrowserPlatform'
      - type: object
        required:
        - id
        properties:
          id:
            type: number
            description: ID of the worker.
            example: 122326697
          sessionId:
            type: string
            description: ID of the session.
            example: 550709149fe79e949363b581e774d5ebffa1b8fe
          status:
            type: string
            enum:
            - queue
            - running
            description: Current status of the worker.
            example: running
          browser_url:
            type: string
            description: Dashboard URL of the session
            example: ''
