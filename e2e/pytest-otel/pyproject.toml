[project]
name = "browserstack-otel-pytest-e2e"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pytest>=9.1.1",
    "pytest-opentelemetry>=1.1.0",
    "pytest-playwright>=0.10.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["e2e"]
addopts = "-p no:cacheprovider"
