packages:
  - "packages/*"
  - "packages/cli/typescript"
allowBuilds:
  esbuild: true

peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: "6"

overrides:
  esbuild@<0.28.1: ">=0.28.1"
  vite@<=6.4.1: ">=6.4.2"
  uuid@<14.0.0: ">=14.0.0"
  fast-uri@<=3.1.1: ">=3.1.2"
  brace-expansion@>=5.0.0 <5.0.6: ">=5.0.6"

# Upstream: @yao-pkg/pkg (latest) still depends on prebuild-install@7.
allowedDeprecatedVersions:
  prebuild-install: "7"
